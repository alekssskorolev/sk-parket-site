name: Verify pilot supplier price source
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cloud-functions/ydb-stage1/function/parket-sale.js'
      - 'scripts/check-price-source.cjs'
      - '.github/workflows/price-source-check.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.15.0'
      - name: Read one public product page without changing calculator prices
        run: node scripts/check-price-source.cjs
