name: Prepare public SEO content
on:
  push:
    branches: [seo/p1-static]
    paths:
      - 'scripts/refresh-public-content.mjs'
      - 'scripts/render-public.mjs'
      - '.github/workflows/seo-prepare.yml'
permissions:
  contents: write
concurrency:
  group: seo-public-content-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'alekssskorolev/sk-parket-site' && github.ref == 'refs/heads/seo/p1-static'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: seo/p1-static
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the existing pinned image processor
        run: npm ci --prefix cloud-functions/ydb-stage1/function --ignore-scripts --no-audit --no-fund
      - name: Fetch only public content and generate responsive files
        run: node scripts/refresh-public-content.mjs
      - name: Build reproducible static portfolio and rate reference
        run: |
          npm run build:pages
          node --test test/seo.test.mjs
          npm test
          node --test cloud-functions/ydb-stage1/test/*.test.cjs
      - name: Save prepared source to the review branch only
        run: |
          test "$GITHUB_REF" = "refs/heads/seo/p1-static"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/assets/seo public/content web-cloud/image-manifest.js docs
          git diff --cached --quiet && exit 0
          git commit -m "Generate static public portfolio, dated rates and responsive images"
          git push origin HEAD:seo/p1-static
