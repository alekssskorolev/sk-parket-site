name: SEO release checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Rebuild and verify committed Pages output
        run: |
          npm run build:pages
          git diff --exit-code -- docs
          node --test test/seo.test.mjs
      - name: Existing calculator, consent, gallery and API regression tests
        run: |
          npm ci --prefix cloud-functions/ydb-stage1/function --ignore-scripts --no-audit --no-fund
          npm test
          node --test cloud-functions/ydb-stage1/test/*.test.cjs
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check published HTTP responses after Pages propagation
        run: node scripts/check-public-seo.mjs seo-evidence/public
      - name: Install browser test tooling outside the project
        run: |
          npm install --prefix "$RUNNER_TEMP/seo-browser" playwright@1.56.1 --ignore-scripts --no-audit --no-fund
          "$RUNNER_TEMP/seo-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check public calculator, menus, gallery, contacts and consents
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/seo-browser/node_modules/playwright/index.mjs
        run: node scripts/check-browser.mjs https://skparket.ru/ seo-evidence/browser
      - name: Save actual HTTP responses and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-production-evidence
          path: seo-evidence/
