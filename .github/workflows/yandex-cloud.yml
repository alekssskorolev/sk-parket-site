name: Deploy skparket-api to Yandex Cloud
on:
  push:
    branches: [main]
    paths:
      - 'cloud-functions/ydb-stage1/**'
      - 'web-cloud/**'
      - 'docs/**'
      - 'scripts/build-cloud.mjs'
      - '.github/workflows/yandex-cloud.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skparket-api-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'alekssskorolev/sk-parket-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      YC_DEPLOY_SA_ID: aje8ha4eb671m98g7l39
      FUNCTION_DIR: cloud-functions/ydb-stage1/function
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.15.0'
      - name: Verify reproducible cloud site
        run: |
          node scripts/build-cloud.mjs
          git diff --exit-code -- docs
      - name: Install pinned dependencies and run tests
        run: |
          npm ci --prefix "$FUNCTION_DIR" --ignore-scripts --no-audit --no-fund
          node --test cloud-functions/ydb-stage1/test/*.test.cjs
      - name: Stage only runtime files
        run: |
          mkdir -p .deploy/function
          for file in index.js app.js admin-app.js admin-storage.js public-app.js telegram.js max.js gallery.js gallery-storage.js ydb-storage.js engine.mjs config.seed.json package.json package-lock.json; do
            cp "$FUNCTION_DIR/$file" .deploy/function/
          done
          cp -R "$FUNCTION_DIR/admin-public" .deploy/function/
      - name: Prepare MAX API certificate trust
        run: |
          mkdir -p .deploy/function/certs
          curl --fail --silent --show-error --retry 2 --max-time 30 --proto '=https' --tlsv1.2 https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt -o .deploy/function/certs/max-root.pem
          openssl x509 -in .deploy/function/certs/max-root.pem -noout -checkend 86400
      - name: Obtain short-lived IAM token through repo-and-main-bound OIDC
        id: iam
        run: node cloud-functions/ydb-stage1/deploy/oidc-auth.cjs
      - name: Publish function version
        id: deploy
        uses: yc-actions/yc-sls-function@69db7ed03bdb0b8f9be48f43f68746ee135d649d # v3.1.0
        with:
          yc-iam-token: ${{ steps.iam.outputs.token }}
          folder-id: b1g5jvictf4s63dq76k4
          function-name: skparket-api
          runtime: nodejs22
          entrypoint: index.handler
          source-root: .deploy/function
          include: '.'
          memory: 256Mb
          execution-timeout: '30'
          service-account: ajeo58qnnk9drt1hj0l7
          logs-disabled: 'true'
          secrets: |
            ADMIN_PASSWORD=e6q7cg1917m1bgbnuion/e6qofldtgge73ciqn5nd/ADMIN_PASSWORD_V2
            TELEGRAM_BOT_TOKEN=e6qsesqbjgppvd1u31eu/e6qovakr6rgmo5spjbop/TELEGRAM_BOT_TOKEN
            MAX_BOT_TOKEN=e6qel7905g721cv89pa5/e6qdqu7l9m46hrrq9l49/MAX_BOT_TOKEN
          environment: |
            GALLERY_BUCKET=skparket-gallery-b1g5jvictf4s63dq76k4
            YDB_ENDPOINT=grpcs://ydb.serverless.yandexcloud.net:2135
            YDB_DATABASE=/ru-central1/b1giavulfpadcrjur0gm/etndibb9bo594a8l1qp5
            TEST_WRITES_ENABLED=false
            LEADS_ENABLED=true
            PRIVACY_OPERATOR_CONFIRMED=yes
            CONSENT_VERSION=skparket-pd-v3
            ADMIN_ORIGIN=https://d5dbi82cmvjpt86kth9a.d8epmcec.apigw.yandexcloud.net
      - name: Verify private health endpoint without creating leads
        env:
          YC_IAM_TOKEN: ${{ steps.iam.outputs.token }}
        run: |
          node <<'JS'
          (async () => {
            const response = await fetch('https://functions.yandexcloud.net/d4e98jo86kn9o7f75fia?route=/health', {
              headers: {Authorization: 'Bearer ' + process.env.YC_IAM_TOKEN},
              signal: AbortSignal.timeout(45000),
            });
            if (!response.ok) throw new Error('Health check HTTP ' + response.status);
            const result = await response.json();
            if (result.ok !== true || result.database !== 'connected' || result.maxConfigured !== true) throw new Error('Unexpected health response');
            console.log('Private function is connected to YDB. No customer records created.');
          })().catch(error => {console.error(error.message);process.exitCode = 1;});
          JS
      - name: Verify isolated admin requires authentication
        run: |
          node <<'JS'
          (async () => {
            const base = 'https://d5dbi82cmvjpt86kth9a.d8epmcec.apigw.yandexcloud.net';
            async function stableFetch(url, options = {}) {
              for (let attempt = 0; ; attempt++) {
                try {
                  const r = await fetch(url, {...options, signal: AbortSignal.timeout(45000)});
                  if (![502, 503, 504].includes(r.status) || attempt >= 3) return r;
                  await r.arrayBuffer();
                } catch (e) { if (attempt >= 3) throw e; }
                await new Promise(resolve => setTimeout(resolve, 2500));
              }
            }
            for (const [path, expected] of [['/admin', 200], ['/admin.js', 200], ['/gallery-admin.js', 200], ['/api/admin/gallery', 401], ['/api/session', 401], ['/api/admin/leads', 401], ['/api/admin/config', 401]]) {
              const response = await stableFetch(base + path);
              if (response.status !== expected) throw new Error(path + ': expected ' + expected + ', received ' + response.status);
              console.log(path + ': ' + response.status);
            }
            const direct = await stableFetch('https://functions.yandexcloud.net/d4e98jo86kn9o7f75fia');
            if (direct.status !== 403) throw new Error('Function must remain private');
            const configResponse = await stableFetch(base + '/api/config', {headers: {Origin: 'https://alekssskorolev.github.io'}, signal: AbortSignal.timeout(45000)});
            if (!configResponse.ok) throw new Error('Public config unavailable');
            const config = await configResponse.json();
            if (config.leadsEnabled !== true || config.consentVersion !== 'skparket-pd-v3' || config.photosEnabled !== false) throw new Error('Intake configuration is incorrect');
            if (configResponse.headers.get('access-control-allow-origin') !== 'https://alekssskorolev.github.io') throw new Error('Public CORS configuration is incorrect');
            console.log('Public form is enabled with versioned consent. No leads created by workflow.');
            console.log('Function is private; admin data requires a valid session.');
          })().catch(error => {console.error(error.message);process.exitCode = 1;});
          JS
